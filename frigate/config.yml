################################################################
# Titre: config.yml (Frigate Advanced)
# Description : Configuration Frigate avec accélération moderne et MQTT
# Auteur: Ravindra JOB
# Source: https://github.com/ravindrajob/
# Update: 22/05/2026 [v1.1 | RJ] Adding OpenVINO & Detailed MQTT events
################################################################

mqtt:
  host: n8n.ravindra-job.com
  user: ${MQTT_USER}
  password: ${MQTT_PASSWORD}
  topic_prefix: frigate
  client_id: frigate_lab

# Accélération matérielle moderne (CAF & CNCF Compliance)
detectors:
  # Option 1: Intel OpenVINO (Standard pour les CPU Intel modernes)
  ov:
    type: openvino
    device: AUTO
  # Option 2: Google Coral (Historique)
  # coral:
  #   type: edgetpu
  #   device: usb

cameras:
  entree_principale:
    ffmpeg:
      inputs:
        - path: rtsp://viewer:password@10.100.0.50:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
            - rtmp
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
        - car
    snapshots:
      enabled: true
      timestamp: true
      bounding_box: true
      retain:
        default: 7

# Configuration de la publication des événements pour le ChatOps
database:
  path: /config/frigate.db

event_detention:
  days: 14
