# ==============================================================================
# Fichier : config.yml
# Description : Configuration Frigate NVR pour le Lab de Simulation
# Environnement : Lab public de démonstration (ravindra-job.com)
# ==============================================================================

mqtt:
  host: n8n.ravindra-job.com # Simulation d'un broker sur le meme réseau lab
  user: ${MQTT_USER}
  password: ${MQTT_PASSWORD}

detectors:
  coral:
    type: edgetpu
    device: usb

cameras:
  entree_principale:
    ffmpeg:
      inputs:
        - path: rtsp://viewer:password@192.168.1.50:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
            - rtmp
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
        - car
        - dog

  jardin_arriere:
    ffmpeg:
      inputs:
        - path: rtsp://viewer:password@192.168.1.51:554/cam/realmonitor?channel=1&subtype=1
          roles:
            - detect
    detect:
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person

# Enregistrement des clips lors de la detection d'une personne
record:
  enabled: true
  retain:
    days: 7
    mode: motion
  events:
    retain:
      default: 14
      mode: active_objects
