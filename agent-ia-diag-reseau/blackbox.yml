modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      method: GET
  tcp_connect:
    prober: tcp
    timeout: 5s
  icmp:
    prober: icmp
    timeout: 5s
  dns:
    prober: dns
    timeout: 5s
    dns:
      query_name: "ravindra-job.com" # Sera remplacé par le paramètre 'target'