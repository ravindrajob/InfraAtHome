################################################################
# Titre: envoy.yaml
# Description : Composant technique du Lab de Simulation
# Auteur: Ravindra JOB
# Source: https://github.com/ravindrajob/
# Update: 22/05/2026 [v1.0 | RJ]
################################################################
static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: local_route
            virtual_hosts:
            - name: frigate_vhost
              domains: ["frigate.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: frigate_cluster
            - name: metube_vhost
              domains: ["metube.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: metube_cluster
            - name: tautulli_vhost
              domains: ["tautulli.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: tautulli_cluster
            - name: immich_vhost
              domains: ["immich.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: immich_cluster
            - name: dashy_vhost
              domains: ["dashy.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: dashy_cluster
            - name: languagetool_vhost
              domains: ["languagetool.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: languagetool_cluster
            - name: listmonk_vhost
              domains: ["listmonk.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: listmonk_cluster
            - name: n8n_vhost
              domains: ["n8n.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: n8n_cluster
            - name: esphome_vhost
              domains: ["esphome.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: esphome_cluster
            - name: plex_vhost
              domains: ["plex.ravindra-job.com"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: plex_cluster
  clusters:
  - name: frigate_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: frigate_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: frigate
                port_value: 5000
  - name: metube_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: metube_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: metube
                port_value: 8081
  - name: tautulli_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: tautulli_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: tautulli
                port_value: 8181
  - name: immich_cluster
    connect_timeout: 5s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: immich_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
